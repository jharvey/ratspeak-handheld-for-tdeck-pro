; Standalone T-Deck Pro GPS check (see src/main.cpp). Build: pio run   (in this folder)
; Flash the app only:  esptool.py --chip esp32s3 --port COMx --no-stub write_flash 0x10000 .pio/build/gpscheck/firmware.bin
[platformio]
boards_dir = ../../boards

[env:gpscheck]
platform = espressif32@6.7.0
board = lilygo_t_deck_pro
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
