; INA226 battery-current logger for the T-Deck Pro board floor (guide §6.6).
; Runs on a separate small ESP32 (default: ESP32-C3 SuperMini, I2C SDA=8 SCL=9), not on the T-Deck.
; Build:  pio run                (in this folder)
; Flash:  pio run -t upload --upload-port COMx
;         or esptool.py --chip esp32c3 --port COMx write_flash 0x0 .pio/build/c3/bootloader.bin
;            0x8000 .pio/build/c3/partitions.bin 0x10000 .pio/build/c3/firmware.bin
; Log:    python log.py COMx --out floor.csv      (see README.md)
[platformio]
default_envs = c3

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200

; ESP32-C3 SuperMini (native USB serial/JTAG). Its blue LED sits on GPIO 8 = SDA and flickers with I2C traffic (harmless).
[env:c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio   ; works on every SuperMini flash chip
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DINA_SDA=8
    -DINA_SCL=9

; Any classic ESP32 devkit with a USB-UART chip (SDA 21, SCL 22).
[env:esp32]
board = esp32dev
build_flags =
    -DINA_SDA=21
    -DINA_SCL=22
