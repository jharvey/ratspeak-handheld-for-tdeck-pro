# Simulator hardware setup, example: a unit out in the field.
#   sim\build\ratspeak-sim.exe --name field --config sim\configs\field.ini
# or copy it to sim\build\simdata\<name>\sim.ini to make it that device's default.
# Command-line options (--sd, --battery, --usb, --charged, --gps, --sats) override it.

sd = 32G               # card size (512M, 32G, 1T ...) or none = empty slot
battery = 61           # percent
usb = off              # on = plugged into USB (charging)
charged = off          # with usb = on: charging finished
gps = 43.556,-70.711   # fix, nofix, or a fix at LAT,LON
sats = 9               # satellites in the fix
# flashkb = 8064       # internal flash (LittleFS) size in KB
# fast = on            # instant e-ink refresh
