; Shared firmware configuration with one environment per board.
;   [env:tdeck]               -> T-Deck Plus (default)
;   [env:tpager]              -> T-Lora-Pager
;   [env:cardputer]           -> Cardputer Adv
;   [env:tdeck_pro]           -> T-Deck Pro (baseline)
;   [env:tdeck_pro_cooperative] -> T-Deck Pro Cooperative / Node (current working)
;   [env:tdeck_pro_node]      -> T-Deck Pro Node UI
;   [env:tdeck_pro_standalone] -> T-Deck Pro Standalone e-ink LVGL (new)

[platformio]
default_envs = tdeck
boards_dir = boards
build_dir = .pio/build

[common]
platform = espressif32@6.7.0
framework = arduino

build_flags =
    -std=gnu++17
    -fexceptions
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSTORAGE_DEFERRED_IO=1
    "-I${PROJECT_DIR}"
    "-I${PROJECT_DIR}/src/core"

build_unflags =
    -fno-exceptions
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@7.4.3

extra_scripts =
    pre:tools/check_build_identity.py
    pre:tools/patch_wifi_sockets_pio.py
    pre:tools/patch_hwcdc_pio.py

monitor_speed = 115200

[lvgl16_base]
extends = common

board_build.flash_size = 16MB
board_build.partitions = partitions/standalone-16mb.csv
board_upload.flash_size = 16MB

build_flags =
    ${common.build_flags}
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    "-I${PROJECT_DIR}/src/ui/lvgl"

lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11
    zinggjm/GxEPD2@^1.5.5
    adafruit/Adafruit GFX Library@^1.11.9

lib_archive = false

[tdeck_base]
extends = lvgl16_base
board = lilygo-t-display-s3
board_build.arduino.memory_type = qio_opi
build_src_filter = +<core/> +<ui/lvgl/> +<boards/tdeck/>
build_flags =
    ${lvgl16_base.build_flags}
    -DRSDECK=1
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
    "-I${PROJECT_DIR}/src/boards/tdeck"

[tdeck_Pro_base]
extends = lvgl16_base
board = lilygo-t-display-s3
board_build.arduino.memory_type = qio_opi
; Headless / node UI: core + board, no full LVGL app (e-ink, not IPS)
build_src_filter = +<core/> -<core/runtime/LvglApplication.cpp> -<ui/lvgl/> +<boards/tdeck_Pro/>
build_flags =
    ${lvgl16_base.build_flags}
    -DRSDECK=1
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
    "-I${PROJECT_DIR}/src/boards/tdeck_Pro"
    -DARDUINO_LOOP_STACK_SIZE=32768

[tpager_base]
extends = lvgl16_base
board = lilygo_t_pager
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
build_src_filter = +<core/> +<ui/lvgl/> +<boards/tpager/>
build_flags =
    ${lvgl16_base.build_flags}
    -DRATPAGER=1
    -DDISPLAY_WIDTH=480
    -DDISPLAY_HEIGHT=222
    "-I${PROJECT_DIR}/src/boards/tpager"

[cardputer_base]
extends = common
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.partitions = partitions/standalone-8mb.csv
board_upload.flash_size = 8MB
build_src_filter = +<core/> +<ui/canvas/> +<boards/cardputer/>
build_flags =
    ${common.build_flags}
    -DRSCARDPUTER=1
    -DDISPLAY_WIDTH=240
    -DDISPLAY_HEIGHT=135
    "-I${PROJECT_DIR}/src/ui/canvas"
    "-I${PROJECT_DIR}/src/boards/cardputer"
lib_deps =
    ${common.lib_deps}
    https://github.com/m5stack/M5GFX.git#53a7184601f3667b030ba141c58b87ce2acfaa2a
    https://github.com/m5stack/M5Unified.git#a6256725481f1bc366655fa48cf03b6095e30ad1
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#69d36199d606ab56de1f0f990f2b01f416a9cc9f
    https://github.com/m5stack/M5Cardputer.git#e0232804763d3e42d7e9be90e43cf6e1c9e7565b
upload_protocol = esptool

[protocol]
build_flags =
    -DRS_HANDHELD_FFI_LINKED=1
    "-I${PROJECT_DIR}/protocol/include"
    -lratspeak_protocol

[m9_base]
extends = lvgl16_base
upload_speed = 115200
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
build_src_filter = +<core/> -<core/radio/SX1262.cpp> +<ui/lvgl/> +<boards/m9/>
build_unflags =
    ${common.build_unflags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_flags =
    ${lvgl16_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DRSM9=1
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
    "-I${PROJECT_DIR}/src/boards/m9"
lib_deps =
    ${lvgl16_base.lib_deps}
    https://github.com/jgromes/RadioLib.git#ef715e1be6643ffb6cc585cde4c33770caf875b1

[env:m9]
extends = m9_base
build_flags =
    ${m9_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1

[protocol_small]
build_flags =
    ${protocol.build_flags}
    "-L${PROJECT_DIR}/protocol/prebuilt/xtensa-esp32s3/small"

[protocol_micro]
build_flags =
    ${protocol.build_flags}
    "-L${PROJECT_DIR}/protocol/prebuilt/xtensa-esp32s3/micro"

[env:tdeck]
extends = tdeck_base
upload_speed = 115200
build_flags =
    ${tdeck_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1

[env:tdeck_pro]
extends = tdeck_Pro_base
upload_speed = 115200
build_flags =
    ${tdeck_Pro_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1
    -DTDECK_PRO_BUILD=1
    -DFIRMWARE_NAME=\"ratspeak-tdeck-pro\"
    -DFIRMWARE_VERSION=\"V0.1-Baseline\"

[env:tpager]
extends = tpager_base
build_flags =
    ${tpager_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1

[env:cardputer]
extends = cardputer_base
build_flags =
    ${cardputer_base.build_flags}
    ${protocol_micro.build_flags}

[env:tdeck_cooperative]
extends = env:tdeck
build_flags =
    ${tdeck_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=0

[env:tdeck_pro_cooperative]
extends = tdeck_Pro_base
upload_speed = 115200
build_flags =
    ${tdeck_Pro_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=0
    -DTDECK_PRO_BUILD=1
    -DFIRMWARE_NAME=\"ratspeak-tdeck-pro\"
    -DFIRMWARE_VERSION=\"V0.1-Baseline\"
    -DARDUINO_LOOP_STACK_SIZE=32768

; Display node: same hardware filter as cooperative, richer e-ink + node behavior
[env:tdeck_pro_node]
extends = tdeck_Pro_base
upload_speed = 115200
build_flags =
    ${tdeck_Pro_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=0
    -DTDECK_PRO_BUILD=1
    -DTDECK_PRO_NODE_UI=1
    -DFIRMWARE_NAME=\"ratspeak-tdeck-pro-node\"
    -DFIRMWARE_VERSION=\"V0.2-NodeUI\"
    -DARDUINO_LOOP_STACK_SIZE=32768

[env:tpager_cooperative]
extends = env:tpager
build_flags =
    ${tpager_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=0

; ============================================================
; NEW: Standalone e-ink LVGL UI for T-Deck Pro
; ============================================================
; ============================================================
; Standalone e-ink bring-up for T-Deck Pro
; Excludes full Plus LvglApplication until display is proven
; ============================================================
[env:tdeck_pro_standalone]
extends = tdeck_Pro_base
upload_speed = 115200

build_src_filter =
    +<core/>
    -<core/runtime/LvglApplication.cpp>
    -<ui/lvgl/>
    +<boards/tdeck_Pro/>
    -<boards/cardputer/>
    -<boards/tdeck/>
    -<boards/tpager/>
    -<boards/m9/>

build_flags =
    ${tdeck_Pro_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=0
    -DTDECK_PRO_BUILD=1
    -DTDECK_PRO_STANDALONE=1
    -DHAS_EINK=1
    -DFIRMWARE_NAME=\"ratspeak-tdeck-pro-standalone\"
    -DFIRMWARE_VERSION=\"V0.3-EinkBringup\"
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
	-DLV_FONT_MONTSERRAT_14=1
         -DLV_FONT_DEFAULT=&lv_font_montserrat_14