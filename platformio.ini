; ===== T-Deck Pro Standalone (e-ink) =====
[env:tdeck_pro_standalone]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions/16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D HAS_DISPLAY=1
    -D HAS_EINK=1
    -D HAS_KEYBOARD=1
    -D HAS_TOUCH=1
    -D HAS_LORA=1
    -D HAS_GPS=1
    -D BOARD_TDECK_PRO=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=1
    -D LV_COLOR_16_SWAP=0
    -D LV_USE_LOG=1
    -D LV_TICK_CUSTOM=1
    -D LV_MEM_CUSTOM=0
    -D LV_MEM_SIZE="(96U * 1024U)"
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_DEFAULT=&lv_font_montserrat_14
    -I src
    -I src/ui/lvgl
    -I src/board/tdeck_pro

build_src_filter =
    +<*>
    +<../src/ui/lvgl/*>
    +<../src/board/tdeck_pro/*>
    -<ui/canvas/*>

lib_deps =
    lvgl/lvgl@^8.4.0
    ; keep your existing protocol / RadioLib / etc. deps