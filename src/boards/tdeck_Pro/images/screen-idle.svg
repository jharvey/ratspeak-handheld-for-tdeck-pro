  <text x="120" y="248" text-anchor="middle" font-size="12" fill="#111">D D D D D : H H : M M</text>
  <text x="120" y="266" text-anchor="middle" font-size="12" fill="#111">0 0 0 0 0 : 0 4 : 4 0</text>
  <text x="120" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#111">MyRatSpeakPro</text>
