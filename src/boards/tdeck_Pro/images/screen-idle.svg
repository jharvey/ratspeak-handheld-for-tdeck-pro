    <circle cx="-7" cy="-22" r="5" fill="#f4f1e8" stroke="#111"/>
    <circle cx="7" cy="-22" r="5" fill="#f4f1e8" stroke="#111"/>
    <circle cx="-4" cy="-13" r="1.2" fill="#111" stroke="none"/>
    <circle cx="4" cy="-13" r="1.2" fill="#111" stroke="none"/>
    <ellipse cx="0" cy="-8" rx="2" ry="1.2" fill="#111" stroke="none"/>
  </g>
