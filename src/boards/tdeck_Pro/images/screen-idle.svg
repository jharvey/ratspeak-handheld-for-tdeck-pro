  <text x="120" y="110" text-anchor="middle" font-size="14" fill="#111">0 1 / 0 9 / 2 7</text>
  <text x="120" y="130" text-anchor="middle" font-size="14" fill="#111">1 4 : 0 8   E S T</text>
  <rect x="98" y="142" width="18" height="28" rx="1" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="103" y="139" width="8" height="3" fill="#111"/>
  <rect x="100" y="150" width="14" height="16" fill="#111"/>
