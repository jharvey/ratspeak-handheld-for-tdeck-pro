<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="240" height="320" fill="#f4f1e8"/>
  <!-- refresh: two arrows in circle -->
  <rect x="0" y="0" width="28" height="36" fill="none" stroke="#111" stroke-width="1"/>
  <g transform="translate(14,18)" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
    <path d="M -5,-3 A 6,6 0 1,1 -5,3"/>
    <path d="M -5,-3 L -7,-1 M -5,-3 L -3,-1"/>
    <path d="M 5,3 A 6,6 0 1,1 5,-3"/>
    <path d="M 5,3 L 7,1 M 5,3 L 3,1"/>
  </g>
  <!-- battery vertical -->
  <rect x="28" y="0" width="28" height="36" fill="none" stroke="#111" stroke-width="1"/>
  <rect x="35" y="8" width="14" height="22" rx="1" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="38" y="5" width="8" height="3" fill="#111"/>
  <rect x="37" y="18" width="10" height="10" fill="#111"/>
  <!-- clock -->
  <rect x="56" y="0" width="92" height="36" fill="none" stroke="#111" stroke-width="1"/>
  <text x="102" y="15" text-anchor="middle" font-size="10" fill="#111">01/09</text>
  <text x="102" y="28" text-anchor="middle" font-size="11" fill="#111">14:08</text>
  <!-- MENU with underline under M only -->
  <rect x="148" y="0" width="92" height="36" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="168" y="23" font-size="12" font-weight="700" fill="#111">M</text>
  <line x1="168" y1="26" x2="178" y2="26" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="23" font-size="12" font-weight="700" fill="#111">ENU</text>
  <!-- identity card -->
  <rect x="0" y="36" width="56" height="56" fill="none" stroke="#111" stroke-width="2"/>
  <text x="28" y="52" text-anchor="middle" font-size="11" fill="#111">69%</text>
  <text x="28" y="68" text-anchor="middle" font-size="10" fill="#111">Batt</text>
  <text x="28" y="84" text-anchor="middle" font-size="10" fill="#111">Online</text>
  <rect x="56" y="36" width="184" height="56" fill="none" stroke="#111" stroke-width="2"/>
  <text x="64" y="54" font-size="11" fill="#111">LXMF</text>
  <text x="64" y="70" font-size="10" fill="#111">baaba93009a1b2c3</text>
  <text x="64" y="84" font-size="10" fill="#111">d4e5f60718293a4b</text>
  <!-- tiles -->
  <g font-size="10" fill="#111">
    <rect x="0" y="96" width="78" height="44" fill="none" stroke="#111"/><text x="39" y="114" text-anchor="middle" font-weight="700">LORA</text><text x="39" y="128" text-anchor="middle">-109 dBm</text>
    <rect x="80" y="96" width="78" height="44" fill="none" stroke="#111"/><text x="119" y="114" text-anchor="middle" font-weight="700">PATH</text><text x="119" y="128" text-anchor="middle">P0</text>
    <rect x="160" y="96" width="80" height="44" fill="none" stroke="#111"/><text x="200" y="114" text-anchor="middle" font-weight="700">LINK</text><text x="200" y="128" text-anchor="middle">L0</text>
    <rect x="0" y="142" width="78" height="44" fill="none" stroke="#111"/><text x="39" y="160" text-anchor="middle" font-weight="700">PEERS</text><text x="39" y="174" text-anchor="middle">0/3</text>
    <rect x="80" y="142" width="78" height="44" fill="none" stroke="#111"/><text x="119" y="160" text-anchor="middle" font-weight="700">AUDIO</text><text x="119" y="174" text-anchor="middle">ON</text>
    <rect x="160" y="142" width="80" height="44" fill="none" stroke="#111"/><text x="200" y="160" text-anchor="middle" font-weight="700">LXMFQ</text><text x="200" y="174" text-anchor="middle">0</text>
  </g>
  <text x="8" y="200" font-size="11" fill="#111">Listening for peers</text>
  <text x="8" y="214" font-size="11" fill="#111">ID chirp: sent</text>
  <!-- Announce button - name BELOW it, not overlapping -->
  <rect x="0" y="220" width="240" height="32" fill="none" stroke="#111" stroke-width="2"/>
  <text x="120" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Announce ID</text>
  <text x="120" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#111">MyRatSpeakPro</text>
  <!-- bottom tabs with underline under C, P, I only -->
  <rect x="0" y="280" width="80" height="40" fill="none" stroke="#111"/>
  <text x="28" y="304" font-size="12" fill="#111">C</text>
  <line x1="28" y1="307" x2="36" y2="307" stroke="#111" stroke-width="1.5"/>
  <text x="38" y="304" font-size="12" fill="#111">ontact</text>
  <rect x="80" y="280" width="64" height="40" fill="none" stroke="#111"/>
  <text x="96" y="304" font-size="12" fill="#111">P</text>
  <line x1="96" y1="307" x2="104" y2="307" stroke="#111" stroke-width="1.5"/>
  <text x="106" y="304" font-size="12" fill="#111">eers</text>
  <rect x="144" y="280" width="96" height="40" fill="none" stroke="#111"/>
  <text x="172" y="304" font-size="12" fill="#111">I</text>
  <line x1="172" y1="307" x2="178" y2="307" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="304" font-size="12" fill="#111">nbox</text>
</svg>
