<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="240" height="320" fill="#f4f1e8"/>
  <rect x="0" y="0" width="28" height="36" fill="none" stroke="#111"/>
  <g transform="translate(14,18)" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
    <path d="M -5,-3 A 6,6 0 1,1 -5,3"/><path d="M -5,-3 L -7,-1 M -5,-3 L -3,-1"/>
    <path d="M 5,3 A 6,6 0 1,1 5,-3"/><path d="M 5,3 L 7,1 M 5,3 L 3,1"/>
  </g>
  <rect x="28" y="0" width="28" height="36" fill="none" stroke="#111"/>
  <rect x="35" y="8" width="14" height="22" rx="1" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="37" y="16" width="10" height="12" fill="#111"/>
  <rect x="56" y="0" width="92" height="36" fill="none" stroke="#111"/>
  <text x="102" y="15" text-anchor="middle" font-size="10" fill="#111">01/09</text>
  <text x="102" y="28" text-anchor="middle" font-size="11" fill="#111">14:08</text>
  <!-- MENU present but NO M underline (entry mode) -->
  <rect x="148" y="0" width="92" height="36" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="194" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#111">MENU</text>
  <text x="8" y="52" font-size="11" fill="#111">Thread: PRO1</text>
  <!-- bubbles -->
  <rect x="8" y="60" width="160" height="36" rx="2" fill="none" stroke="#111"/>
  <text x="16" y="76" font-size="11" fill="#111">hello from field</text>
  <text x="16" y="90" font-size="9" fill="#111">&lt; in</text>
  <rect x="72" y="102" width="160" height="36" rx="2" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="80" y="118" font-size="11" fill="#111">copy, standing by</text>
  <text x="80" y="132" font-size="9" fill="#111">&gt; out</text>
  <rect x="8" y="144" width="150" height="28" rx="2" fill="none" stroke="#111"/>
  <text x="16" y="162" font-size="11" fill="#111">status?</text>
  <!-- compose box - entry mode, no C/P/I underlines on bottom -->
  <rect x="2" y="226" width="236" height="54" fill="none" stroke="#111" stroke-width="2"/>
  <text x="10" y="244" font-size="12" fill="#111">msg&gt;test message_</text>
  <text x="10" y="262" font-size="11" fill="#111">[Ent] send</text>
  <text x="10" y="274" font-size="9" fill="#111">entry mode: M/C/P/I nav off · Alt=case</text>
  <!-- full-width back footer while in thread -->
  <rect x="0" y="280" width="240" height="40" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="120" y="304" text-anchor="middle" font-size="12" fill="#111">^ BACK UP TO INBOX</text>
</svg>
